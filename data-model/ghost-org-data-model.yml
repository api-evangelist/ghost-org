- from: webhook
  to: integration
  type: belongs_to
  via: integration_id
  binding: id-reference
  note: >-
    The integration resource itself is not exposed by the public Admin API reference;
    integrations are created in Ghost Admin.
- from: post
  to: newsletter
  type: belongs_to
  via: newsletter_id
  binding: id-reference
  note: Set at publish time when a post is delivered as email. Write-only on the publish call.
