- from: subscription
  to: tier
  type: belongs_to
  via: tier
  binding: $ref
- from: subscription
  to: stripe_customer
  type: belongs_to
  via: customer
  binding: embedded-object
  note: External. Ghost delegates payment to Stripe; the customer object is a Stripe projection.
- from: offer
  to: tier
  type: belongs_to
