description: >-
  Ghost ships three drop-in browser components that every Ghost theme loads through the
  `{{ghost_head}}` helper rather than through an SDK: Portal (the members signup,
  signin, account and checkout UI), sodo-search (the site search overlay) and comments-ui
  (the member comments thread). They are React bundles published to npm and served from
  Ghost's own CDN at unpkg-style pinned URLs generated by the server, so a site author
  never installs them directly. They are the embeddable UI layer, distinct from the
  Content/Admin API SDKs in packages/ghost-org-packages.yml.
