aid: ghost-org
url: https://raw.githubusercontent.com/api-evangelist/ghost-org/refs/heads/main/apis.yml
name: Ghost
kind: company
description: Ghost is an open-source (MIT) publishing platform for professional publications, newsletters,
  memberships, and paid subscriptions. It can be self-hosted for free or run as the managed Ghost(Pro)
  service, with all Ghost(Pro) revenue funding the non-profit Ghost Foundation. Every Ghost site exposes
  two documented public REST APIs under https://{site}/ghost/api/. The Content API is a read-only, key-authenticated
  interface for delivering published posts, pages, tags, authors, tiers, and settings to front-ends and
  static sites. The Admin API is a read-write, token-authenticated (JWT) interface for managing posts,
  pages, members, tags, tiers, offers, newsletters, users, media, themes, and webhooks.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ghost-org.png
tags:
- Publishing
- Newsletters
- Memberships
- Subscriptions
- CMS
- Open Source
- Content
created: '2026-07-05'
modified: '2026-08-13'
