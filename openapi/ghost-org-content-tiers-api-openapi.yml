openapi: 3.2.0
info:
  title: Ghost Content and Admin Content - Tiers API
  description: Ghost is an open-source (MIT) publishing platform for professional publications, newsletters, memberships, and paid subscriptions.
  version: '5.0'
  contact:
    name: Ghost
    url: https://ghost.org
  license:
    name: MIT
    url: https://github.com/TryGhost/Ghost/blob/main/LICENSE
servers:
- url: https://{admin_domain}/ghost/api
  description: A Ghost site's API root (self-hosted or Ghost(Pro))
  variables:
    admin_domain:
      default: demo.ghost.io
      description: The domain of the Ghost site (Ghost(Pro) uses *.ghost.io).
security:
- contentApiKey: []
- adminJwt: []
tags:
- name: Content - Tiers
  description: Read-only public subscription tiers.
paths:
  /content/tiers/:
    get:
      operationId: browseContentTiers
      tags:
      - Content - Tiers
      summary: Browse public subscription tiers
      parameters:
      - $ref: '#/components/parameters/ContentKey'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A list of public tiers with pricing.
components:
  parameters:
    Filter:
      name: filter
      in: query
      required: false
      description: Ghost NQL filter expression.
      schema:
        type: string
    Include:
      name: include
      in: query
      required: false
      description: Comma-separated related data to include (for example authors,tags).
      schema:
        type: string
    ContentKey:
      name: key
      in: query
      required: true
      description: Content API key.
      schema:
        type: string
  securitySchemes:
    contentApiKey:
      type: apiKey
      in: query
      name: key
      description: Content API key from a Custom Integration, passed as the `key` query parameter. Safe for browser use; grants read-only access to public data.
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Admin API access. An Admin API key (id:secret) is used to sign a short-lived JWT sent as `Authorization: Ghost {token}`. A staff access token or an authenticated user session may also be used.'
