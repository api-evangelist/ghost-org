openapi: 3.2.0
info:
  title: Ghost Content and Admin Content - Pages API
  description: Ghost is an open-source (MIT) publishing platform for professional publications, newsletters, memberships, and paid subscriptions.
  version: '5.0'
  contact:
    name: Ghost
    url: https://ghost.org
  license:
    name: MIT
    url: https://github.com/TryGhost/Ghost/blob/main/LICENSE
servers:
- url: https://{admin_domain}/ghost/api
  description: A Ghost site's API root (self-hosted or Ghost(Pro))
  variables:
    admin_domain:
      default: demo.ghost.io
      description: The domain of the Ghost site (Ghost(Pro) uses *.ghost.io).
security:
- contentApiKey: []
- adminJwt: []
tags:
- name: Content - Pages
  description: Read-only published pages.
paths:
  /content/pages/:
    get:
      operationId: browseContentPages
      tags:
      - Content - Pages
      summary: Browse pages
      parameters:
      - $ref: '#/components/parameters/ContentKey'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A list of pages.
  /content/pages/{id}/:
    get:
      operationId: readContentPageById
      tags:
      - Content - Pages
      summary: Read a page by ID
      parameters:
      - $ref: '#/components/parameters/ContentKey'
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The requested page.
  /content/pages/slug/{slug}/:
    get:
      operationId: readContentPageBySlug
      tags:
      - Content - Pages
      summary: Read a page by slug
      parameters:
      - $ref: '#/components/parameters/ContentKey'
      - $ref: '#/components/parameters/PathSlug'
      responses:
        '200':
          description: The requested page.
components:
  parameters:
    PathSlug:
      name: slug
      in: path
      required: true
      description: The resource slug.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      required: false
      description: Ghost NQL filter expression.
      schema:
        type: string
    ContentKey:
      name: key
      in: query
      required: true
      description: Content API key.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Page number of results to return.
      schema:
        type: integer
        default: 1
    PathId:
      name: id
      in: path
      required: true
      description: The resource ID.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records per page (default 15, or 'all').
      schema:
        type: string
        default: '15'
  securitySchemes:
    contentApiKey:
      type: apiKey
      in: query
      name: key
      description: Content API key from a Custom Integration, passed as the `key` query parameter. Safe for browser use; grants read-only access to public data.
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Admin API access. An Admin API key (id:secret) is used to sign a short-lived JWT sent as `Authorization: Ghost {token}`. A staff access token or an authenticated user session may also be used.'
