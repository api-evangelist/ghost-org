openapi: 3.2.0
info:
  title: Ghost Content and Admin Content - Posts API
  description: Ghost is an open-source (MIT) publishing platform for professional publications, newsletters, memberships, and paid subscriptions.
  version: '5.0'
  contact:
    name: Ghost
    url: https://ghost.org
  license:
    name: MIT
    url: https://github.com/TryGhost/Ghost/blob/main/LICENSE
servers:
- url: https://{admin_domain}/ghost/api
  description: A Ghost site's API root (self-hosted or Ghost(Pro))
  variables:
    admin_domain:
      default: demo.ghost.io
      description: The domain of the Ghost site (Ghost(Pro) uses *.ghost.io).
security:
- contentApiKey: []
- adminJwt: []
tags:
- name: Content - Posts
  description: Read-only published posts.
paths:
  /content/posts/:
    get:
      operationId: browseContentPosts
      tags:
      - Content - Posts
      summary: Browse posts
      description: Returns a paginated list of published posts.
      parameters:
      - $ref: '#/components/parameters/ContentKey'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Order'
      - $ref: '#/components/parameters/Formats'
      responses:
        '200':
          description: A list of posts with pagination meta.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /content/posts/{id}/:
    get:
      operationId: readContentPostById
      tags:
      - Content - Posts
      summary: Read a post by ID
      parameters:
      - $ref: '#/components/parameters/ContentKey'
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The requested post.
        '404':
          $ref: '#/components/responses/NotFound'
  /content/posts/slug/{slug}/:
    get:
      operationId: readContentPostBySlug
      tags:
      - Content - Posts
      summary: Read a post by slug
      parameters:
      - $ref: '#/components/parameters/ContentKey'
      - $ref: '#/components/parameters/PathSlug'
      - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The requested post.
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Formats:
      name: formats
      in: query
      required: false
      description: Content formats to return, for example 'html,lexical'.
      schema:
        type: string
    PathSlug:
      name: slug
      in: path
      required: true
      description: The resource slug.
      schema:
        type: string
    Order:
      name: order
      in: query
      required: false
      description: Sort order, for example 'published_at desc'.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      required: false
      description: Ghost NQL filter expression.
      schema:
        type: string
    PathId:
      name: id
      in: path
      required: true
      description: The resource ID.
      schema:
        type: string
    ContentKey:
      name: key
      in: query
      required: true
      description: Content API key.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Page number of results to return.
      schema:
        type: integer
        default: 1
    Fields:
      name: fields
      in: query
      required: false
      description: Comma-separated list of fields to return.
      schema:
        type: string
    Include:
      name: include
      in: query
      required: false
      description: Comma-separated related data to include (for example authors,tags).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records per page (default 15, or 'all').
      schema:
        type: string
        default: '15'
  responses:
    Unauthorized:
      description: Authentication failed or was missing.
    NotFound:
      description: The requested resource was not found.
  securitySchemes:
    contentApiKey:
      type: apiKey
      in: query
      name: key
      description: Content API key from a Custom Integration, passed as the `key` query parameter. Safe for browser use; grants read-only access to public data.
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Admin API access. An Admin API key (id:secret) is used to sign a short-lived JWT sent as `Authorization: Ghost {token}`. A staff access token or an authenticated user session may also be used.'
