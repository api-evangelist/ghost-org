openapi: 3.2.0
info:
  title: Ghost Content and Admin Admin - Themes API
  description: Ghost is an open-source (MIT) publishing platform for professional publications, newsletters, memberships, and paid subscriptions.
  version: '5.0'
  contact:
    name: Ghost
    url: https://ghost.org
  license:
    name: MIT
    url: https://github.com/TryGhost/Ghost/blob/main/LICENSE
servers:
- url: https://{admin_domain}/ghost/api
  description: A Ghost site's API root (self-hosted or Ghost(Pro))
  variables:
    admin_domain:
      default: demo.ghost.io
      description: The domain of the Ghost site (Ghost(Pro) uses *.ghost.io).
security:
- contentApiKey: []
- adminJwt: []
tags:
- name: Admin - Themes
  description: Theme upload and activation.
paths:
  /admin/themes/upload/:
    post:
      operationId: uploadAdminTheme
      tags:
      - Admin - Themes
      summary: Upload a theme
      description: Uploads a theme as a zip package using multipart/form-data.
      parameters:
      - $ref: '#/components/parameters/AcceptVersion'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The uploaded theme.
  /admin/themes/{name}/activate/:
    put:
      operationId: activateAdminTheme
      tags:
      - Admin - Themes
      summary: Activate a theme
      parameters:
      - $ref: '#/components/parameters/AcceptVersion'
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The activated theme.
components:
  parameters:
    AcceptVersion:
      name: Accept-Version
      in: header
      required: false
      description: Minimum compatible API version, for example v5.0.
      schema:
        type: string
        example: v5.0
  securitySchemes:
    contentApiKey:
      type: apiKey
      in: query
      name: key
      description: Content API key from a Custom Integration, passed as the `key` query parameter. Safe for browser use; grants read-only access to public data.
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Admin API access. An Admin API key (id:secret) is used to sign a short-lived JWT sent as `Authorization: Ghost {token}`. A staff access token or an authenticated user session may also be used.'
