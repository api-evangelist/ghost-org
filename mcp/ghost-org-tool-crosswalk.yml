provider: Ghost
providerId: ghost-org
description: >-
  Binds every first-party Ghost MCP tool to the REST operation it calls. The ghst MCP
  server is a thin wrapper over the Ghost Admin API, so most tools map one-to-one onto a
  captured operationId; the stats, comments, social-web (ActivityPub) and site-alias
  tools have no counterpart in the captured OpenAPI and are listed as mcp_only. The
  hosted docs MCP server at docs.ghost.org/mcp is a documentation-search surface with no
  REST backing at all and is recorded separately.
surfaces:
  openapi:
    dir: openapi/
    specs_wired: 19
    note: >-
      Operation names below come from the wired admin-*/content-* specs. Where an
      operation exists only in the sibling capture of the same API, the `spec` field
      names the file.
  graphql:
    endpoint: null
    note: >-
      Ghost publishes no GraphQL endpoint. graphql/ghost-org-schema.graphql in this repo
      is a conceptual data-model SDL, not an introspectable surface.
  mcp:
  - url: https://docs.ghost.org/mcp
    mode: remote
    gated: false
    note: Anonymous; tools/list answered 200. Documentation search only.
  - package: '@tryghost/ghst'
    mode: local-stdio
    gated: true
    note: >-
      Requires `ghst auth login` with a Ghost staff access token, so the live
      inputSchemas could not be introspected anonymously. Tool names are read from the
      published source; parameters are inherited from the bound REST operation.
