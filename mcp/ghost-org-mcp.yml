generated: '2026-08-13'
method: probed
source: >-
  https://docs.ghost.org/mcp (live initialize + tools/list) and
  https://github.com/TryGhost/ghst (first-party CLI shipping an MCP server)
provider: Ghost
providerId: ghost-org
description: >-
  Ghost ships two distinct first-party MCP surfaces. A hosted, anonymous, read-only
  documentation server runs at https://docs.ghost.org/mcp and answers a live tools/list.
  A separate local MCP server is built into @tryghost/ghst, Ghost's modern CLI, and is
  started with `ghst mcp stdio` (or `ghst mcp http` bound to loopback); it exposes the
  full Ghost Admin API surface as ~90 tools against a site the operator has already
  authenticated. The hosted server can be called by an agent today; the Admin-API server
  requires a human to install and authenticate the CLI first.
deployment:
  mode: both
  endpoint: https://docs.ghost.org/mcp
  install: npm install -g @tryghost/ghst && ghst mcp stdio --tools all
  package: https://www.npmjs.com/package/@tryghost/ghst
  auth: none
  verified: probed
  note: >-
    `auth: none` describes the hosted endpoint at docs.ghost.org/mcp, which answered
    initialize and tools/list anonymously and serves only published documentation. The
    local stdio/http server inherits the CLI's own credential (a Ghost staff access
    token or Admin API key, `ghst auth login`) and is therefore api-key authenticated.
    The two servers are different products on different surfaces — recorded together
    because both are first-party Ghost MCP servers.
servers:
- id: ghost-developer-docs
  name: Ghost Developer Docs
  mode: remote
  endpoint: https://docs.ghost.org/mcp
  transport: streamable-http
  protocolVersion: '2025-06-18'
  serverVersion: '1.0.0'
  auth: none
  status: live
  verified: probed
  x-evidence:
    fetched: '2026-08-13'
    initialize_status: 200
    tools_list_status: 200
    content_type: text/event-stream
  instructions: >-
    Server-declared: read-only, scoped to the Ghost Developer Docs site; provides search
    and retrieval over published documentation and exposes skill resources.
  tools:
  - name: search_ghost_developer_docs
    title: Search documentation
    inputs: [query]
    readOnly: true
    description: Search the Ghost Developer Docs knowledge base for guides, API reference and code examples.
  - name: query_docs_filesystem_ghost_developer_docs
    inputs: [command]
    readOnly: true
    description: >-
      Read-only shell-like query (rg/grep/find/tree/ls/cat/head/jq) against a virtualised
      in-memory filesystem containing only the Ghost docs pages.
  - name: submit_feedback
    title: Submit documentation feedback
    inputs: [path, feedback]
    readOnly: false
    description: Report an incorrect, outdated or incomplete documentation page to the docs team.
  resources:
  - uri: mintlify://skills/ghost
    name: ghost
    mimeType: text/markdown
    note: Same skill body published at /.well-known/agent-skills/ghost/skill.md
- id: ghst-cli
  name: ghst MCP server (Ghost Admin API)
  mode: local-stdio
  install: npm install -g @tryghost/ghst
  run:
  - ghst mcp stdio --tools all
  - ghst mcp http --host 127.0.0.1 --port 3100 --tools posts,tags,site --auth-token <token>
  package: https://www.npmjs.com/package/@tryghost/ghst
  repository: https://github.com/TryGhost/ghst
  version: 0.16.5
  published: '2026-08-10'
  auth: api-key
  status: beta
  verified: searched
  source: https://github.com/TryGhost/ghst/blob/main/README.md
  note: >-
    Pre-1.0 and explicitly labelled beta by Ghost. `ghst mcp http` binds to loopback by
    default; exposing it publicly requires --unsafe-public-bind. Not a hosted endpoint.
  tool_groups: [posts, pages, tags, members, comments, site, settings, users, api, search, socialweb, stats]
  tool_count: 90
  tools_source: https://github.com/TryGhost/ghst/blob/main/src/mcp/tools/core.ts
