description: >-
  Anonymous probe of the standard /.well-known/ paths on every host named in apis.yml
  and in the OpenAPI servers[] blocks. Ghost is self-hosted software as well as a
  managed service, so the only Ghost-controlled hosts that can serve a /.well-known/
  document are ghost.org (marketing), docs.ghost.org (developer docs) and demo.ghost.io
  (the public demo Ghost site referenced in the Content API docs). Customer-run Ghost
  installs live on customer domains and are out of scope.
