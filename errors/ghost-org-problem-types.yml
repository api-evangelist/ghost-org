method: searched
source: >-
  https://docs.ghost.org/content-api/errors, derived from 4xx/5xx responses in openapi/,
  and confirmed against live unauthenticated responses from https://demo.ghost.io
provider: Ghost
providerId: ghost-org
description: >-
  Ghost returns a single error envelope across both the Content API and the Admin API: a
  JSON object with an `errors` array. It is not RFC 9457 problem+json — the media type is
  application/json and the discriminator is the `type` field (documented as `errorType`
  on the Content API errors page, but emitted as `type` by a live Ghost 6.x install).
  Every error object carries a UUID `id`, which is the value to quote in a support
  report.
format:
  rfc9457: false
  media_type: application/json
  envelope: '{"errors": [ { ... } ]}'
  discriminator: type
  fields:
  - name: message
    type: string
    description: Human-readable statement of what went wrong. Designed to be the primary signal.
  - name: context
    type: string|null
    description: Additional detail, often the remediation hint.
  - name: type
    type: string
    description: >-
      Error class name, e.g. UnauthorizedError, NoPermissionError, NotFoundError. The
      Content API documentation calls this field `errorType`; live 6.x responses emit
      `type`.
  - name: details
    type: object|null
    description: Structured validation detail where applicable.
  - name: property
    type: string|null
    description: The offending request property on validation failures.
  - name: help
    type: string|null
    description: Optional pointer to documentation.
  - name: code
    type: string|null
    description: Machine-readable code where Ghost defines one, e.g. UNKNOWN_CONTENT_API_KEY.
  - name: id
    type: string (uuid)
    description: Per-response identifier. Quote this when reporting an error.
  - name: ghostErrorCode
    type: string|null
