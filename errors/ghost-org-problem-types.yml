problem_types:
- status: 400
  type: BadRequestError
  title: Badly formed query
  documented: true
  remediation: >-
    URL-encode query parameter values. `filter` uses NQL and must be encoded when passed
    directly; the JavaScript client libraries do this for you.
  source: https://docs.ghost.org/content-api/errors
- status: 401
  type: UnauthorizedError
  title: Authentication failure
  code: UNKNOWN_CONTENT_API_KEY
  documented: true
  occurrences_in_spec: 50
  remediation: >-
    Content API: supply a valid `key` query parameter from a Custom Integration. Admin
    API: send `Authorization: Ghost <jwt>` signed with a current Admin API key or staff
    access token — the JWT is short-lived and single use.
  observed: true
- status: 403
  type: NoPermissionError
  title: Permission denied
  documented: true
  remediation: >-
    The credential was recognised but is not allowed to perform this action, or no
    credential was determinable at all. Check the integration's role and, for member
    auth, that cookies are being forwarded.
  observed: true
- status: 404
  type: NotFoundError
  title: Unknown resource
  documented: true
  occurrences_in_spec: 29
  remediation: >-
    Also returned for data that exists but is not public — an unpublished post is a 404
    to the Content API, not a 403.
  observed: true
- status: 409
  type: UpdateCollisionError
  title: Update collision due to stale updated_at value
  documented: true
  occurrences_in_spec: 2
  remediation: >-
    Ghost uses `updated_at` as an optimistic concurrency token on PUT. Re-read the
    resource, carry the fresh `updated_at` into the request body, and retry.
  source: openapi/ (409 responses on edit operations)
- status: 415
  type: UnsupportedMediaTypeError
  title: Unsupported media type
  documented: true
  occurrences_in_spec: 1
  remediation: Upload endpoints expect multipart/form-data with a supported image or theme type.
- status: 422
  type: ValidationError
  title: Validation failed
  documented: true
  occurrences_in_spec: 18
  remediation: >-
    Read `property` and `details` to find the failing field. Common causes are a missing
    required field or a value outside the allowed enum.
- status: 500
  type: InternalServerError
  title: Server error
  documented: true
  remediation: Retry with backoff; if persistent, report the error `id` to the site operator.
  source: https://docs.ghost.org/content-api/errors
